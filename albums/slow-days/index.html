<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>把日子唱慢一點｜李詩民</title><style>body{margin:0;background:#f3eee4;color:#34382e;font:16px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:48px 24px}h1{font-size:42px;margin-bottom:4px}header{border-bottom:1px solid #babcae;margin-bottom:28px;padding-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px}article{background:#fffaf2;padding:24px;border-radius:12px;border:1px solid #ddd8cc}h2{font-size:22px}.status{color:#68775a}textarea{box-sizing:border-box;width:100%;height:180px;font:14px/1.6 system-ui;background:#fffcf7;border:1px solid #cbc8bd;padding:10px}textarea.style{height:110px}a,button{display:inline-block;padding:7px 12px;margin:4px 5px 4px 0;background:#486348;color:white;border:0;border-radius:5px;text-decoration:none;cursor:pointer}audio{width:100%}small{display:block;color:#74776b}label{display:block;margin-top:12px}</style><main><header><small>李詩民 · SUNO V6 · 20 首原創國語歌曲</small><h1>把日子唱慢一點</h1><p>把時間留給早餐、家人、老朋友，和陪你慢慢回家的人。</p><p id="progress">讀取製作進度…</p><button onclick="location.reload()">更新進度</button><a href="20首歌詞與提示詞.md" download>下載全部歌詞與提示詞</a></header><div class="grid" id="tracks"></div></main><script>
const el=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e;};
fetch('album.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{document.getElementById('progress').textContent=`已取得生成結果 ${a.tracks.filter(t=>t.providerResults.length).length} / 20 首；已下載 ${a.tracks.filter(t=>t.downloads?.length).length} / 20 首。每首選定 A 版。`;for(const t of a.tracks){const c=el('article');c.dataset.id=t.id;c.dataset.submissionTitle=t.submissionTitle;c.append(el('h2',`${t.id} ${t.title}`));const s=el('p',({downloaded_selected:'A 版已選定，完整解碼通過',generated_pending_download:'已生成，等待下載',download_incomplete:'下載未完成，待確認瀏覽器狀態',downloaded_pending_listening:'已下載，待試聽選版',generating:'生成中',prepared:'歌詞已備妥'})[t.status]||t.status);s.className='status';c.append(s);for(const [kind,label] of [['style','編曲提示詞'],['lyrics','完整歌詞']]){c.append(el('label',label));const x=el('textarea');x.className=kind;x.value=t[kind];x.readOnly=true;c.append(x);const b=el('button','複製'+label);b.onclick=()=>navigator.clipboard.writeText(t[kind]);c.append(b);}for(const r of t.providerResults){const l=el('a',`Suno 版本 ${r.variant||''} · ${r.uiDuration||''}`);l.href=r.url;l.target='_blank';c.append(l);}for(const d of t.downloads||[]){const l=el('a',`下載 ${d.variant||''} ${d.format}`);l.href=d.path;l.download='';c.append(l);if(d.format==='mp3'){const au=el('audio');au.controls=true;au.preload='none';au.src=d.path;c.append(au);}}c.append(el('small',`下載位置：${t.downloadDirectory}/`));if(!t.downloads?.length)c.append(el('small','音訊尚未下載；完成後這裡會出現下載按鈕。'));document.getElementById('tracks').append(c);}});
</script></html>
